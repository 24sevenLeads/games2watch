<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Games2Watch — Alle Europese voetbalwedstrijden op één plek. Zie waar de wedstrijd om gaat en op welk kanaal je hem kunt kijken.">
<title>Games2Watch — Europees Voetbal Nederland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;--bg2:#16181c;--bg3:#1e2026;--border:#2a2d35;
  --text:#e8eaf0;--muted:#6b7280;--muted2:#9ca3af;
  --champ:#f59e0b;--cl-direct:#3b82f6;--cl-pre:#60a5fa;
  --el-direct:#10b981;--el-pre:#34d399;--conf:#a78bfa;
  --rel-direct:#ef4444;--rel-playoff:#f97316;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;border-bottom:1px solid var(--border)}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;text-decoration:none;color:var(--text)}
.logo span{color:var(--champ)}
.logo small{font-size:12px;font-weight:600;color:var(--muted2);font-family:'Inter',sans-serif;margin-left:3px;vertical-align:middle}
.header-meta{font-size:11px;color:var(--muted)}

.filters{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.filter-btn{font-size:13px;font-weight:600;background:none;border:none;color:var(--muted2);padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;flex-shrink:0}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{color:var(--text);border-bottom-color:var(--champ)}
.flag-img{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;background-size:cover;background-position:center}
.flag-eng{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;background:white;position:relative;overflow:hidden}
.flag-eng::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#CF0000}
.flag-eng-h{position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#CF0000}
/* Nederland — rood/wit/blauw horizontaal */
.flag-nl{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-nl::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#AE1C28 0%,#AE1C28 33.3%,#fff 33.3%,#fff 66.6%,#21468B 66.6%,#21468B 100%)}
/* Duitsland — zwart/rood/goud horizontaal */
.flag-de{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-de::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#000 0%,#000 33.3%,#DD0000 33.3%,#DD0000 66.6%,#FFCE00 66.6%,#FFCE00 100%)}
/* Spanje — rood/geel/rood horizontaal */
.flag-es{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-es::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#c60b1e 0%,#c60b1e 25%,#ffc400 25%,#ffc400 75%,#c60b1e 75%,#c60b1e 100%)}
/* Italië — groen/wit/rood verticaal */
.flag-it{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-it::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,#009246 0%,#009246 33.3%,#fff 33.3%,#fff 66.6%,#ce2b37 66.6%,#ce2b37 100%)}
/* Frankrijk — blauw/wit/rood verticaal */
.flag-fr{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-fr::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,#002395 0%,#002395 33.3%,#fff 33.3%,#fff 66.6%,#ED2939 66.6%,#ED2939 100%)}
/* Portugal — groen/rood verticaal (40/60) */
.flag-pt{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:middle;margin-right:1px;overflow:hidden;position:relative}
.flag-pt::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,#006600 0%,#006600 40%,#FF0000 40%,#FF0000 100%)}
.sub-filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 16px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:36px}
.sub-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:4px;border:1px solid transparent;background:none;color:var(--muted2);cursor:pointer;transition:all .15s;white-space:nowrap}
.sub-btn:hover{color:var(--text);background:var(--bg3)}
.sub-btn.active{color:var(--text);background:var(--bg3);border-color:var(--muted)}

.sec-filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec-label{font-size:10px;color:var(--muted);margin-right:2px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap}
.tag-btn{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:none;color:var(--muted2);cursor:pointer;transition:all .15s;white-space:nowrap}
.tag-btn:hover,.tag-btn.active{background:var(--bg3);color:var(--text);border-color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted2);cursor:pointer;padding:3px 7px;border-radius:4px;border:1px solid transparent;transition:all .15s}
.leg-item:hover{border-color:var(--border);background:var(--bg3)}
.leg-item.active{border-color:var(--muted);background:var(--bg3);color:var(--text)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.stats-bar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.stat-block{display:flex;flex-direction:column;justify-content:center;padding:9px 14px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.stat-block:last-child{border-right:none}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:2px}
.stat-value{font-size:17px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px;line-height:1}
.stat-block.s-free .stat-value{color:#10b981}
.stat-block.s-paid .stat-value{color:var(--muted2)}
.stat-block.zender{cursor:pointer;transition:background .15s}
.stat-block.zender:hover{background:var(--bg3)}
.stat-block.zender.active{background:var(--bg3);border-bottom:2px solid var(--champ)}
.zender-name{font-size:10px;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted2)}
.stat-block.zender.active .zender-name{color:var(--text)}

.main{padding:14px 16px;max-width:1100px;margin:0 auto}

.day-sep{display:flex;align-items:center;gap:10px;padding:18px 0 8px}
.day-sep:first-child{padding-top:6px}
.day-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.day-line{flex:1;height:1px;background:var(--border)}

.match-row{display:grid;grid-template-columns:52px 1fr 110px;align-items:center;gap:12px;padding:9px 12px;border-radius:7px;margin-bottom:3px;background:var(--bg2);border:1px solid var(--border);transition:border-color .15s}
.match-row:hover{border-color:#3a3d47}
.m-time{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:0.5px}
.m-teams{display:flex;flex-direction:column;gap:3px}
.m-comp{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.team-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.team-rank{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);min-width:24px;flex-shrink:0}
.team-name{font-weight:600;font-size:13px}
.vs-row{font-size:10px;color:var(--muted);padding-left:30px}.leg-score{color:#f59e0b;font-weight:700;font-size:11px}
.stake-badge{font-size:9px;font-weight:600;letter-spacing:0.04em;padding:2px 6px;border-radius:3px;white-space:nowrap}
.b-champ    {background:#f59e0b22;color:var(--champ);    border:1px solid #f59e0b44}
.b-cl-direct{background:#3b82f622;color:var(--cl-direct);border:1px solid #3b82f644}
.b-cl-pre   {background:#60a5fa18;color:var(--cl-pre);   border:1px solid #60a5fa35}
.b-el-direct{background:#10b98122;color:var(--el-direct);border:1px solid #10b98144}
.b-el-pre   {background:#34d39918;color:var(--el-pre);   border:1px solid #34d39935}
.b-conf     {background:#a78bfa18;color:var(--conf);     border:1px solid #a78bfa35}
.b-rel-dir    {background:#ef444422;color:var(--rel-direct);border:1px solid #ef444444}
.b-rel-po     {background:#f9741622;color:var(--rel-playoff);border:1px solid #f9741644}
.b-rel-direct {background:#ef444422;color:var(--rel-direct);border:1px solid #ef444444}
.b-rel-playoff{background:#f9741622;color:var(--rel-playoff);border:1px solid #f9741644}

.tv-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tv-logo{font-size:10px;font-weight:600;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);white-space:nowrap;text-align:center}
.tv-logo.viaplay{border-color:#6366f150;color:#818cf8}
.tv-logo.viaplay.free-ch{border-color:#10b98150;color:#10b981}
.tv-logo.espn{border-color:#ef444450;color:#f87171}
.tv-logo.espn.free-ch{border-color:#10b98150;color:#10b981}
.tv-logo.ziggo{border-color:#f59e0b50;color:#fbbf24}
.tv-logo.prime{border-color:#38bdf850;color:#38bdf8}
.tv-logo.npo{border-color:#10b98150;color:#10b981}
.tv-logo.other.free-ch{border-color:#10b98150;color:#10b981}
.tv-logo.other{border-color:var(--border);color:var(--muted2)}
.free-label{font-size:9px;color:#10b981;font-weight:600;letter-spacing:0.04em}

.status-msg{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.loading-bar{width:32px;height:2px;background:var(--champ);animation:load 1s ease-in-out infinite alternate;margin:0 auto 12px;border-radius:2px}
@keyframes load{from{width:20px;opacity:.4}to{width:80px;opacity:1}}
.error-msg{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg2);border-radius:8px;margin:16px 0;border:1px solid var(--border)}
.error-msg strong{display:block;color:var(--rel-direct);margin-bottom:6px}

footer{background:var(--bg2);border-top:1px solid var(--border);padding:20px 16px;margin-top:32px}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-logo{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--muted)}
.footer-logo span{color:var(--champ)}
.footer-source{font-size:11px;color:var(--muted);text-align:right}

@media(max-width:580px){
  .match-row{grid-template-columns:44px 1fr 90px}
  .main{padding:10px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="logo" href="/nl">games2watch<span>.</span>eu <small>/nl</small></a>
    <div class="header-meta" id="cur-date"></div>
  </div>
  <nav class="filters" id="country-filters">
    <button class="filter-btn active" onclick="filterCountry('all',this)">Alle</button>
    <button class="filter-btn" onclick="filterCountry('en',this)"><span class="flag-eng"><span class="flag-eng-h"></span></span> Engeland</button>
    <button class="filter-btn" onclick="filterCountry('nl',this)"><span class="flag-nl"></span> Nederland</button>
    <button class="filter-btn" onclick="filterCountry('de',this)"><span class="flag-de"></span> Duitsland</button>
    <button class="filter-btn" onclick="filterCountry('es',this)"><span class="flag-es"></span> Spanje</button>
    <button class="filter-btn" onclick="filterCountry('it',this)"><span class="flag-it"></span> Italië</button>
    <button class="filter-btn" onclick="filterCountry('fr',this)"><span class="flag-fr"></span> Frankrijk</button>
    <button class="filter-btn" onclick="filterCountry('pt',this)"><span class="flag-pt"></span> Portugal</button>
    <button class="filter-btn" onclick="filterCountry('eu',this)">🏆 Europa</button>
  </nav>
  <div class="sub-filters" id="sub-filters"></div>
</header>

<div class="sec-filters">
  <span class="sec-label">Zender</span>
  <button class="tag-btn" onclick="filterTV('viaplay',this)">Viaplay</button>
  <button class="tag-btn" onclick="filterTV('espn',this)">ESPN</button>
  <button class="tag-btn" onclick="filterTV('ziggo',this)">Ziggo Sport</button>
  <button class="tag-btn" onclick="filterTV('prime',this)">Prime Video</button>
  <button class="tag-btn" onclick="filterTV('npo',this)">NPO (gratis)</button>
  <button class="tag-btn" onclick="filterTV('free',this)">Alle gratis</button>
</div>

<div class="legend" id="legend">
  <div class="leg-item" onclick="filterLegend('champ',this)"><div class="leg-dot" style="background:var(--champ)"></div>Kampioenschap</div>
  <div class="leg-item" onclick="filterLegend('cl-direct',this)"><div class="leg-dot" style="background:var(--cl-direct)"></div>CL direct</div>
  <div class="leg-item" onclick="filterLegend('cl-pre',this)"><div class="leg-dot" style="background:var(--cl-pre)"></div>CL voorronde</div>
  <div class="leg-item" onclick="filterLegend('el-direct',this)"><div class="leg-dot" style="background:var(--el-direct)"></div>EL direct</div>
  <div class="leg-item" onclick="filterLegend('el-pre',this)"><div class="leg-dot" style="background:var(--el-pre)"></div>EL voorronde</div>
  <div class="leg-item" onclick="filterLegend('conf',this)"><div class="leg-dot" style="background:var(--conf)"></div>Conference League</div>
  <div class="leg-item" onclick="filterLegend('rel-dir',this)"><div class="leg-dot" style="background:var(--rel-direct)"></div>Directe degradatie</div>
  <div class="leg-item" onclick="filterLegend('rel-po',this)"><div class="leg-dot" style="background:var(--rel-playoff)"></div>Degradatie play-off</div>
</div>

<div class="stats-bar" id="stats-bar"></div>
<main class="main" id="main-content">
  <div class="status-msg"><div class="loading-bar"></div>Wedstrijden ophalen…</div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">games2watch<span>.</span>eu</div>
    <div class="footer-source" id="fetch-status">Laden…</div>
  </div>
</footer>

<script>
const BADGE_LABELS = {
  champ:       'Kampioen',
  'cl-direct': 'CL direct',
  'cl-pre':    'CL voorronde',
  'el-direct': 'EL direct',
  'el-pre':    'EL voorronde',
  conf:        'Conference',
  'rel-direct':'Degradatie',
  'rel-playoff':'Degr. play-off',
  mid:         '',
};

// Competitie-specifieke overschrijving van labels
const BADGE_LABELS_OVERRIDE = {
  champ:  { champ:'Kampioen', 'cl-direct':'Promotie', 'cl-pre':'Prom. play-offs', 'rel-direct':'Degradatie', 'rel-playoff':'Degradatie' },
  kkd:    { champ:'Kampioen', 'cl-direct':'Promotie', 'cl-pre':'Play-offs', 'rel-direct':'Degradatie', 'rel-playoff':'Degr. play-offs' },
  bl2:    { champ:'Naar Bundesliga', 'cl-direct':'Naar Bundesliga', 'cl-pre':'Relegatie play-offs', 'rel-direct':'Degradatie', 'rel-playoff':'Degr. play-offs' },
};

let MATCHES = [{"sk": "2026-08-04 20:00", "day": "Di 4 aug", "date": "2026-08-04", "time": "20:00", "comp": "Champions League", "leagueKey": "cl", "flag": "🏆", "home": "Olympiacos F.C.", "away": "NEC", "rH": null, "rA": null, "stakeH": "mid", "stakeA": "mid", "tv": {"label": "Ziggo Sport", "cls": "ziggo", "free": false}, "legScore": null}, {"sk": "2026-08-06 20:00", "day": "Do 6 aug", "date": "2026-08-06", "time": "20:00", "comp": "Conference League", "leagueKey": "conf", "flag": "🏆", "home": "Ajax", "away": "Shelbourne F.C.", "rH": null, "rA": null, "stakeH": "mid", "stakeA": "mid", "tv": {"label": "Ziggo Sport", "cls": "ziggo", "free": false}, "legScore": null}, {"sk": "2026-08-06 20:00", "day": "Do 6 aug", "date": "2026-08-06", "time": "20:00", "comp": "Conference League", "leagueKey": "conf", "flag": "🏆", "home": "FC Twente", "away": "FK DAC 1904 Dunajská Streda", "rH": null, "rA": null, "stakeH": "mid", "stakeA": "mid", "tv": {"label": "ESPN", "cls": "espn", "free": true}, "legScore": null}];iveLeague = null;
let activeLeague  = null;
let activeCountry = null;
let activeLegend  = null;
let activeTV      = null;

// Land → competities mapping
const COUNTRY_LEAGUES = {
  en:  [{key:'pl',label:'Premier League'},{key:'champ',label:'Championship'},{key:'facup',label:'FA Cup'}],
  nl:  [{key:'ed',label:'Eredivisie'},{key:'kkd',label:'Keuken Kampioen'},{key:'knvb',label:'KNVB Beker'}],
  de:  [{key:'bl',label:'Bundesliga'},{key:'bl2',label:'2. Bundesliga'},{key:'dfbpokal',label:'DFB-Pokal'}],
  es:  [{key:'ll',label:'La Liga'},{key:'copadelrey',label:'Copa del Rey'}],
  it:  [{key:'sa',label:'Serie A'},{key:'coppaitalia',label:'Coppa Italia'}],
  fr:  [{key:'l1',label:'Ligue 1'},{key:'coupedefrance',label:'Coupe de France'}],
  pt:  [{key:'primeiraliga',label:'Primeira Liga'},{key:'tacaportugal',label:'Taça de Portugal'}],
  eu:  [{key:'cl',label:'Champions League'},{key:'el',label:'Europa League'},{key:'conf',label:'Conference League'}],
};

function filterCountry(country, btn) {
  activeCountry = country === 'all' ? null : country;
  activeLeague = null;
  document.querySelectorAll('#country-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const sub = document.getElementById('sub-filters');
  sub.innerHTML = '';
  if (activeCountry && COUNTRY_LEAGUES[activeCountry]) {
    COUNTRY_LEAGUES[activeCountry].forEach(comp => {
      const b = document.createElement('button');
      b.className = 'sub-btn';
      b.textContent = comp.label;
      b.onclick = () => filterLeague(comp.key, b);
      sub.appendChild(b);

    });
  }
  render();
}

function filterLeague(v, btn) {
  activeLeague = v;
  document.querySelectorAll('#sub-filters .sub-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function filterTV(v,btn){
  activeTV = activeTV===v ? null : v;
  document.querySelectorAll('.sec-filters .tag-btn,.stat-block.zender').forEach(b=>b.classList.remove('active'));
  if(activeTV) btn.classList.add('active');
  render();
}
function filterZenderStat(v,el){
  activeTV = activeTV===v ? null : v;
  document.querySelectorAll('.sec-filters .tag-btn,.stat-block.zender').forEach(b=>b.classList.remove('active'));
  if(activeTV) el.classList.add('active');
  render();
}
function filterLegend(v,el){
  activeLegend = activeLegend===v ? null : v;
  document.querySelectorAll('#legend .leg-item').forEach(b=>b.classList.remove('active'));
  if(activeLegend) el.classList.add('active');
  render();
}

function matchPassesTV(m){
  if(!activeTV) return true;
  if(activeTV==='free') return m.tv && m.tv.free;
  return m.tv && m.tv.cls===activeTV;
}

function getFiltered(){
  return MATCHES.filter(m=>{
    if(activeLeague && m.leagueKey!==activeLeague) return false;
    if(!activeLeague && activeCountry) {
      const keys = (COUNTRY_LEAGUES[activeCountry]||[]).map(c=>c.key);
      if(!keys.includes(m.leagueKey)) return false;
    }
    if(activeLegend && m.stakeH!==activeLegend && m.stakeA!==activeLegend) return false;
    if(!matchPassesTV(m)) return false;
    return true;
  });
}

function renderStats(filtered){
  const total = filtered.length;
  const free  = filtered.filter(m=>m.tv&&m.tv.free).length;
  const paid  = total-free;
  const byCls = {};
  filtered.forEach(m=>{
    const cls = m.tv ? m.tv.cls : 'other';
    if(!byCls[cls]) byCls[cls]={cls,labels:new Set(),count:0};
    byCls[cls].count++;
    if(m.tv) byCls[cls].labels.add(m.tv.label);
  });
  let h = `
    <div class="stat-block"><div class="stat-label">Totaal</div><div class="stat-value">${total}</div></div>
    <div class="stat-block s-free"><div class="stat-label">Gratis</div><div class="stat-value">${free}</div></div>
    <div class="stat-block s-paid"><div class="stat-label">Abonnement</div><div class="stat-value">${paid}</div></div>`;
  ['viaplay','espn','ziggo','prime','npo','other'].forEach(cls=>{
    const e=byCls[cls];
    if(!e||!e.count) return;
    const lbl=[...e.labels].join(' / ');
    const disp=lbl.length>16?cls.charAt(0).toUpperCase()+cls.slice(1):lbl;
    const ac=activeTV===cls?'active':'';
    h+=`<div class="stat-block zender ${ac}" onclick="filterZenderStat('${cls}',this)">
      <div class="zender-name">${disp}</div>
      <div class="stat-value">${e.count}</div></div>`;
  });
  document.getElementById('stats-bar').innerHTML=h;
}

function badgeHtml(key, leagueKey){
  const override = BADGE_LABELS_OVERRIDE[leagueKey];
  const lbl = (override && override[key]) ? override[key] : BADGE_LABELS[key];
  if(!lbl) return '';
  return `<span class="stake-badge b-${key}">${lbl}</span>`;
}


function flagHtml(flag) {
  if (flag === 'ENG') {
    return '<span style="display:inline-block;width:16px;height:11px;border-radius:2px;background:white;position:relative;overflow:hidden;vertical-align:middle;margin-right:2px"><span style="position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#CF0000"></span><span style="position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#CF0000"></span></span>';
  }
  return flag;
}

function render(){
  const filtered=getFiltered();
  renderStats(filtered);
  if(!filtered.length){
    document.getElementById('main-content').innerHTML='<div class="status-msg">Geen wedstrijden gevonden voor deze selectie.</div>';
    return;
  }
  const byDay={};
  const dayOrder=[];
  filtered.forEach(m=>{
    if(!byDay[m.day]){byDay[m.day]=[];dayOrder.push(m.day);}
    byDay[m.day].push(m);
  });
  let html='';
  dayOrder.forEach(day=>{
    const list=byDay[day];
    list.sort((a,b)=>a.time.localeCompare(b.time));
    html+=`<div class="day-sep"><div class="day-name">${day}</div><div class="day-line"></div></div>`;
    list.forEach(m=>{
      const rankH=m.rH?`#${m.rH}`:'';
      const rankA=m.rA?`#${m.rA}`:'';
      const tvCls=m.tv?m.tv.cls+(m.tv.free?' free-ch':''):'other';
      const tvLbl=m.tv?m.tv.label:'?';
      const isFree=m.tv&&m.tv.free;
      html+=`<div class="match-row">
        <div class="m-time">${m.time}</div>
        <div class="m-teams">
          <div class="m-comp">${flagHtml(m.flag)} ${m.comp}</div>
          <div class="team-line">
            <span class="team-rank">${rankH}</span>
            <span class="team-name">${m.home}${m.legScore?` <span class="leg-score">(${m.legScore.split('-')[0]})</span>`:''}</span>
            ${badgeHtml(m.stakeH, m.leagueKey)}
          </div>
          <div class="vs-row">${m.legScore?'':''}</div>
          <div class="team-line">
            <span class="team-rank">${rankA}</span>
            <span class="team-name">${m.away}${m.legScore?` <span class="leg-score">(${m.legScore.split('-')[1]})</span>`:''}</span>
            ${badgeHtml(m.stakeA, m.leagueKey)}
          </div>
        </div>
        <div class="tv-col">
          <div class="tv-logo ${tvCls}">${tvLbl}</div>
          ${isFree?'<div class="free-label">✓ GRATIS</div>':''}
        </div>
      </div>`;
    });
  });
  document.getElementById('main-content').innerHTML=html;
}


async function loadMatches(){
  document.getElementById('fetch-status').textContent='Speelschema bijgewerkt: zo 2 aug 23:48';
  render();
}


document.getElementById('cur-date').textContent=
  new Date().toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'long'});

loadMatches();
</script>
</body>
</html>
