name: Dagelijkse update

on:
  schedule:
    - cron: '0 23 * * *'  # Elke dag om 23:00 UTC (01:00 Nederlandse tijd)
  workflow_dispatch:       # Ook handmatig te starten via GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update draaien
        run: python3 update.py

      - name: Wijzigingen committen en pushen
        run: |
          git config user.name "games2watch-bot"
          git config user.email "bot@games2watch.eu"
          git add nl/index.html data/
          git diff --staged --quiet || git commit -m "Auto-update $(date +'%Y-%m-%d %H:%M')"
          git push
