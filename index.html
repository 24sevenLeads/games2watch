<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Games2Watch — Alle Europese voetbalwedstrijden op één plek. Zie waar de wedstrijd om gaat en waar je hem kunt kijken in Nederland.">
<meta property="og:title" content="Games2Watch — Europees voetbal TV-gids Nederland">
<meta property="og:description" content="Eredivisie, Premier League, Bundesliga, La Liga, Serie A en Ligue 1. Met inzetkleuren per club en live TV-info.">
<link rel="canonical" href="https://games2watch.eu/nl">
<title>Games2Watch — Europees Voetbal Nederland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;--bg2:#16181c;--bg3:#1e2026;--border:#2a2d35;
  --text:#e8eaf0;--muted:#6b7280;--muted2:#9ca3af;
  --champ:#f59e0b;--cl-direct:#3b82f6;--cl-pre:#60a5fa;
  --el-direct:#10b981;--el-pre:#34d399;--conf:#a78bfa;
  --rel-direct:#ef4444;--rel-playoff:#f97316;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;border-bottom:1px solid var(--border)}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;text-decoration:none;color:var(--text)}
.logo span{color:var(--champ)}
.logo small{font-size:12px;font-weight:600;color:var(--muted2);font-family:'Inter',sans-serif;margin-left:3px;vertical-align:middle}
.header-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;align-items:center}
.live-dot{width:6px;height:6px;background:#ef4444;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.filters{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.filter-btn{font-size:12px;font-weight:500;background:none;border:none;color:var(--muted2);padding:10px 12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;flex-shrink:0}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{color:var(--text);border-bottom-color:var(--champ)}

.sec-filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec-label{font-size:10px;color:var(--muted);margin-right:2px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap}
.tag-btn{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:none;color:var(--muted2);cursor:pointer;transition:all .15s;white-space:nowrap}
.tag-btn:hover,.tag-btn.active{background:var(--bg3);color:var(--text);border-color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted2);cursor:pointer;padding:3px 7px;border-radius:4px;border:1px solid transparent;transition:all .15s}
.leg-item:hover{border-color:var(--border);background:var(--bg3)}
.leg-item.active{border-color:var(--muted);background:var(--bg3);color:var(--text)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.stats-bar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.stat-block{display:flex;flex-direction:column;justify-content:center;padding:9px 14px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.stat-block:last-child{border-right:none}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:2px}
.stat-value{font-size:17px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px;line-height:1}
.stat-block.s-free .stat-value{color:#10b981}
.stat-block.s-paid .stat-value{color:var(--muted2)}
.stat-block.zender{cursor:pointer;transition:background .15s}
.stat-block.zender:hover{background:var(--bg3)}
.stat-block.zender.active{background:var(--bg3);border-bottom:2px solid var(--champ)}
.stat-block.zender .stat-value,.zender-name{color:var(--muted2)}
.stat-block.zender.active .stat-value,.stat-block.zender.active .zender-name{color:var(--text)}
.zender-name{font-size:10px;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.04em}

.main{padding:14px 16px;max-width:1100px;margin:0 auto}

.day-sep{display:flex;align-items:center;gap:10px;padding:18px 0 8px}
.day-sep:first-child{padding-top:6px}
.day-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.day-line{flex:1;height:1px;background:var(--border)}
.day-count2{font-size:11px;font-family:'Inter',sans-serif;background:var(--bg3);padding:2px 7px;border-radius:10px;color:var(--muted);white-space:nowrap}

.match-row{display:grid;grid-template-columns:52px 1fr 100px;align-items:center;gap:12px;padding:9px 12px;border-radius:7px;margin-bottom:3px;background:var(--bg2);border:1px solid var(--border);transition:border-color .15s}
.match-row:hover{border-color:#3a3d47}
.m-time{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:0.5px}
.m-teams{display:flex;flex-direction:column;gap:3px}
.m-comp{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.team-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.team-rank{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);min-width:20px;flex-shrink:0}
.team-name{font-weight:600;font-size:13px}
.vs-row{font-size:10px;color:var(--muted);padding-left:26px}
.stake-badge{font-size:9px;font-weight:600;letter-spacing:0.04em;padding:2px 6px;border-radius:3px;white-space:nowrap}
.b-champ    {background:#f59e0b22;color:var(--champ);    border:1px solid #f59e0b44}
.b-cl-direct{background:#3b82f622;color:var(--cl-direct);border:1px solid #3b82f644}
.b-cl-pre   {background:#60a5fa18;color:var(--cl-pre);   border:1px solid #60a5fa35}
.b-el-direct{background:#10b98122;color:var(--el-direct);border:1px solid #10b98144}
.b-el-pre   {background:#34d39918;color:var(--el-pre);   border:1px solid #34d39935}
.b-conf     {background:#a78bfa18;color:var(--conf);     border:1px solid #a78bfa35}
.b-rel-dir  {background:#ef444422;color:var(--rel-direct);border:1px solid #ef444444}
.b-rel-po   {background:#f9741622;color:var(--rel-playoff);border:1px solid #f9741644}

.tv-logo{font-size:10px;font-weight:600;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);white-space:nowrap;display:block;text-align:center;margin-bottom:3px}
.tv-logo:last-child{margin-bottom:0}
.tv-logo.viaplay{border-color:#6366f150;color:#818cf8}
.tv-logo.espn   {border-color:#ef444450;color:#f87171}
.tv-logo.espn.free-ch{border-color:#10b98150;color:#10b981}
.tv-logo.ziggo  {border-color:#f59e0b50;color:#fbbf24}
.tv-logo.prime  {border-color:#38bdf850;color:#38bdf8}
.tv-logo.npo    {border-color:#10b98150;color:#10b981}

.status-msg{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.loading-bar{width:32px;height:2px;background:var(--champ);animation:load 1s ease-in-out infinite alternate;margin:0 auto 12px;border-radius:2px}
@keyframes load{from{width:20px;opacity:.4}to{width:80px;opacity:1}}

.error-msg{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg2);border-radius:8px;margin:16px 0;border:1px solid var(--border)}
.error-msg strong{display:block;color:var(--rel-direct);margin-bottom:6px}

footer{background:var(--bg2);border-top:1px solid var(--border);padding:20px 16px;margin-top:32px}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-logo{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--muted)}
.footer-logo span{color:var(--champ)}
.footer-links{display:flex;gap:16px}
.footer-links a{font-size:11px;color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--muted2)}
.footer-source{font-size:10px;color:var(--muted);font-family:'Inter',sans-serif}

@media(max-width:580px){
  .match-row{grid-template-columns:44px 1fr 88px}
  .main{padding:10px}
  .sec-filters,.legend,.stats-bar{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <a class="logo" href="/nl">games2watch<span>.</span>eu <small>/nl</small></a>
    <div class="header-meta">
      <span style="display:flex;align-items:center;gap:4px"><div class="live-dot"></div>Live bijgewerkt</span>
      <span id="cur-date"></span>
    </div>
  </div>
  <nav class="filters" id="league-filters">
    <button class="filter-btn active" onclick="filterLeague('all',this)">Alle competities</button>
    <button class="filter-btn" onclick="filterLeague('pl',this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
    <button class="filter-btn" onclick="filterLeague('ed',this)">🇳🇱 Eredivisie</button>
    <button class="filter-btn" onclick="filterLeague('bl',this)">🇩🇪 Bundesliga</button>
    <button class="filter-btn" onclick="filterLeague('ll',this)">🇪🇸 La Liga</button>
    <button class="filter-btn" onclick="filterLeague('sa',this)">🇮🇹 Serie A</button>
    <button class="filter-btn" onclick="filterLeague('l1',this)">🇫🇷 Ligue 1</button>
    <button class="filter-btn" onclick="filterLeague('cl',this)">🏆 CL</button>
    <button class="filter-btn" onclick="filterLeague('el',this)">🏆 EL</button>
    <button class="filter-btn" onclick="filterLeague('conf',this)">🏆 Conference</button>
  </nav>
</header>

<div class="sec-filters">
  <span class="sec-label">Zender</span>
  <button class="tag-btn" onclick="filterTV('viaplay',this)">Viaplay</button>
  <button class="tag-btn" onclick="filterTV('espn',this)">ESPN</button>
  <button class="tag-btn" onclick="filterTV('ziggo',this)">Ziggo Sport</button>
  <button class="tag-btn" onclick="filterTV('prime',this)">Prime Video</button>
  <button class="tag-btn" onclick="filterTV('npo',this)">NPO (gratis)</button>
  <button class="tag-btn" onclick="filterTV('free',this)">Alle gratis</button>
</div>

<div class="legend" id="legend">
  <div class="leg-item" onclick="filterLegend('champ',this)"><div class="leg-dot" style="background:var(--champ)"></div>Kampioenschap</div>
  <div class="leg-item" onclick="filterLegend('cl-direct',this)"><div class="leg-dot" style="background:var(--cl-direct)"></div>CL direct</div>
  <div class="leg-item" onclick="filterLegend('cl-pre',this)"><div class="leg-dot" style="background:var(--cl-pre)"></div>CL voorronde</div>
  <div class="leg-item" onclick="filterLegend('el-direct',this)"><div class="leg-dot" style="background:var(--el-direct)"></div>EL direct</div>
  <div class="leg-item" onclick="filterLegend('el-pre',this)"><div class="leg-dot" style="background:var(--el-pre)"></div>EL voorronde</div>
  <div class="leg-item" onclick="filterLegend('conf',this)"><div class="leg-dot" style="background:var(--conf)"></div>Conference League</div>
  <div class="leg-item" onclick="filterLegend('rel-dir',this)"><div class="leg-dot" style="background:var(--rel-direct)"></div>Directe degradatie</div>
  <div class="leg-item" onclick="filterLegend('rel-po',this)"><div class="leg-dot" style="background:var(--rel-playoff)"></div>Degradatie play-off</div>
</div>

<div class="stats-bar" id="stats-bar"></div>
<main class="main" id="main-content">
  <div class="status-msg">
    <div class="loading-bar"></div>
    Wedstrijden ophalen…
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">games2watch<span>.</span>eu</div>
    <div class="footer-links">
      <a href="/nl">Nederland</a>
    </div>
    <div class="footer-source" id="fetch-status">Laden…</div>
  </div>
</footer>

<script>
// ── ZENDER CSS-KLASSEN ──
const ZENDER_CLS = {
  viaplay:'viaplay', espn:'espn', ziggo:'ziggo', prime:'prime', npo:'npo', other:'other'
};

// ── BADGE LABELS ──
const BADGE_LABELS = {
  champ:'Kampioenschap','cl-direct':'CL direct','cl-pre':'CL voorronde',
  'el-direct':'EL direct','el-pre':'EL voorronde',conf:'Conference',
  'rel-dir':'Degradatie','rel-po':'Play-off',mid:'',
};

// ── GROUPEER ZENDERNAMEN voor filter ──
function tvCls(m) {
  return m.tv ? m.tv.cls : 'other';
}

// ── STATE ──
let MATCHES     = [];
let activeLeague = 'all';
let activeLegend = null;
let activeTV     = null;  // cls string: 'viaplay','espn','ziggo','prime','npo' of 'free'

// ── FILTERS ──
function filterLeague(v,btn){
  activeLeague=v;
  document.querySelectorAll('#league-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterTV(v,btn){
  activeTV = activeTV===v ? null : v;
  document.querySelectorAll('.sec-filters .tag-btn,.stat-block.zender').forEach(b=>b.classList.remove('active'));
  if(activeTV) btn.classList.add('active');
  render();
}

function filterZenderStat(v,el){
  activeTV = activeTV===v ? null : v;
  document.querySelectorAll('.sec-filters .tag-btn,.stat-block.zender').forEach(b=>b.classList.remove('active'));
  if(activeTV) el.classList.add('active');
  render();
}

function filterLegend(v,el){
  activeLegend = activeLegend===v ? null : v;
  document.querySelectorAll('#legend .leg-item').forEach(b=>b.classList.remove('active'));
  if(activeLegend) el.classList.add('active');
  render();
}

function matchPassesTV(m) {
  if (!activeTV) return true;
  if (activeTV === 'free') return m.tv && m.tv.free;
  return m.tv && m.tv.cls === activeTV;
}

function getFiltered(){
  return MATCHES.filter(m=>{
    if(activeLeague!=='all' && m.leagueKey!==activeLeague) return false;
    if(activeLegend && m.stakeH!==activeLegend && m.stakeA!==activeLegend) return false;
    if(!matchPassesTV(m)) return false;
    return true;
  });
}

// ── STATS BAR ──
function renderStats(filtered){
  const total = filtered.length;
  const free  = filtered.filter(m=>m.tv&&m.tv.free).length;
  const paid  = total - free;

  // Tel per cls
  const byCls = {};
  filtered.forEach(m=>{
    const cls = m.tv ? m.tv.cls : 'other';
    if(!byCls[cls]) byCls[cls] = {cls, labels:new Set(), count:0};
    byCls[cls].count++;
    if(m.tv) byCls[cls].labels.add(m.tv.label);
  });

  let h = `
    <div class="stat-block"><div class="stat-label">Totaal</div><div class="stat-value">${total}</div></div>
    <div class="stat-block s-free"><div class="stat-label">Gratis</div><div class="stat-value">${free}</div></div>
    <div class="stat-block s-paid"><div class="stat-label">Betaald</div><div class="stat-value">${paid}</div></div>`;

  // Vaste volgorde
  ['viaplay','espn','ziggo','prime','npo','other'].forEach(cls => {
    const entry = byCls[cls];
    if (!entry || !entry.count) return;
    const label = [...entry.labels].join(' / ');
    const displayLabel = label.length > 14 ? cls.charAt(0).toUpperCase()+cls.slice(1) : label;
    const ac = activeTV===cls ? 'active' : '';
    h += `<div class="stat-block zender ${ac}" data-cls="${cls}" onclick="filterZenderStat('${cls}',this)">
      <div class="zender-name">${displayLabel}</div>
      <div class="stat-value">${entry.count}</div>
    </div>`;
  });

  document.getElementById('stats-bar').innerHTML = h;
}

// ── RENDER ──
function badgeHtml(key){
  const label = BADGE_LABELS[key];
  if(!label) return '';
  return `<span class="stake-badge b-${key}">${label}</span>`;
}

function render(){
  const filtered = getFiltered();
  renderStats(filtered);

  if(!filtered.length){
    document.getElementById('main-content').innerHTML =
      '<div class="status-msg">Geen wedstrijden gevonden voor deze selectie.</div>';
    return;
  }

  // Groepeer op dag (volgorde uit de data — al chronologisch van de bron)
  const byDay = {};
  const dayOrder = [];
  filtered.forEach(m=>{
    if(!byDay[m.day]){ byDay[m.day]=[]; dayOrder.push(m.day); }
    byDay[m.day].push(m);
  });

  let html = '';
  dayOrder.forEach(day=>{
    const list = byDay[day];
    // Sorteer binnen de dag op tijd
    list.sort((a,b)=>a.time.localeCompare(b.time));

    html += `<div class="day-sep">
      <div class="day-name">${day}</div>
      <div class="day-line"></div>
      <div class="day-count2">${list.length}</div>
    </div>`;

    list.forEach(m=>{
      const rankH  = m.rH && m.rH !== '?' ? `#${m.rH}` : '';
      const rankA  = m.rA && m.rA !== '?' ? `#${m.rA}` : '';
      const tvCls  = m.tv ? m.tv.cls + (m.tv.free ? ' free-ch' : '') : '';
      const tvLbl  = m.tv ? m.tv.label : '?';

      html += `<div class="match-row">
        <div class="m-time">${m.time}</div>
        <div class="m-teams">
          <div class="m-comp">${m.flag} ${m.comp}</div>
          <div class="team-line">
            <span class="team-rank">${rankH}</span>
            <span class="team-name">${m.home}</span>
            ${badgeHtml(m.stakeH)}
          </div>
          <div class="vs-row">vs</div>
          <div class="team-line">
            <span class="team-rank">${rankA}</span>
            <span class="team-name">${m.away}</span>
            ${badgeHtml(m.stakeA)}
          </div>
        </div>
        <div><div class="tv-logo ${tvCls}">${tvLbl}</div></div>
      </div>`;
    });
  });

  document.getElementById('main-content').innerHTML = html;
}

// ── LOAD DATA VAN API ──
async function loadMatches() {
  try {
    const res  = await fetch('/api/matches');
    if (!res.ok) throw new Error(`API ${res.status}`);

    const data = await res.json();

    if (!data.matches || data.matches.length === 0) {
      throw new Error('Geen wedstrijden ontvangen van de bron');
    }

    MATCHES = data.matches;

    // Toon tijdstip van ophalen
    const fetchedAt = data.fetched_at
      ? new Date(data.fetched_at).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})
      : '?';
    document.getElementById('fetch-status').textContent =
      `Speelschema bijgewerkt om ${fetchedAt}`;

    render();

  } catch(err) {
    console.error('loadMatches error:', err.message);
    document.getElementById('main-content').innerHTML = `
      <div class="error-msg">
        <strong>Speelschema tijdelijk niet beschikbaar</strong>
        We hebben een probleem met het ophalen van de wedstrijden. Probeer het over enkele minuten opnieuw.
      </div>`;
    document.getElementById('fetch-status').textContent = 'Data tijdelijk niet beschikbaar';
    document.getElementById('stats-bar').innerHTML =
      '<div class="stat-block"><div class="stat-label">Totaal</div><div class="stat-value">—</div></div>';
  }
}

// ── INIT ──
document.getElementById('cur-date').textContent =
  new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

loadMatches();
</script>
</body>
</html>
